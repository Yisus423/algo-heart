[project]
name = "algo-heart"
version = "0.1.0"
description = "Heart risk demo: interview-style Streamlit app over a synthetic risk dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
