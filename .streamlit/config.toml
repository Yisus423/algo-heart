# Algorithmics design tokens, sampled from screenshots of the course page with
# `PIL` (most-common colour per region), never eyeballed.
#
# Reference tokens that Streamlit theming cannot express are named as constants
# in app.py: deep purple #602B7A, indigo #220E56, alt surface #F7F9FA, neutral
# chip #E8ECF0, cream #FFF4E2, mint #E6FFE2, gradient #8355D5 -> #AF78F1.

[theme]
base = "light"
primaryColor = "#833AE0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1E7FE"
# A lighter lavender than the #F0DAFF sampled from the reference chips: this
# value paints the whole sidebar and the chat input, and at full strength it
# turned an accent into a 300px block of colour. #F0DAFF is still named in
# app.py for accents.
textColor = "#0F1C2C"
linkColor = "#833AE0"
borderColor = "#E8ECF0"
baseRadius = "0.75rem"
showSidebarBorder = false

# The heading family is an INFERENCE from those screenshots, not a measured
# token: Nunito is a close match for the heavy geometric sans in the reference.
#
# These keys must stay above the [[theme.fontFaces]] tables. In TOML, a key after
# an array-of-tables header belongs to that array element, not to [theme], so
# putting them lower would silently stop applying them.
font = "Nunito, sans-serif"
headingFont = "Nunito, sans-serif"

# The font is declared here, as @font-face rules Streamlit builds itself, rather
# than injected as a CSS rule. An earlier version did it with
# `st.markdown("<style>... [class*=\"st-\"] { font-family: ... } ...")`, and that
# selector also matched Streamlit's own icon elements, replacing the
# "Material Symbols Rounded" font it ships locally and breaking every Material
# icon in the interface. See L33 in odd/tasks/heart-risk-chat-demo.md, and
# tests/test_ui.py, which stops it from coming back.
#
# These are the variable-font files, so one file covers the whole weight range
# instead of one file per weight.
[[theme.fontFaces]]
family = "Nunito"
url = "https://fonts.gstatic.com/s/nunito/v31/XRXV3I6Li01BKofINeaBTMnFcQ.woff2"
style = "normal"
weight = "200 1000"

[[theme.fontFaces]]
family = "Nunito"
url = "https://fonts.gstatic.com/s/nunito/v31/XRXX3I6Li01BKofIMNaDRs7nczIH.woff2"
style = "italic"
weight = "200 1000"

[server]
headless = true
